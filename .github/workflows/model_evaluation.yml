name: Daily Forecast Evaluation Run

on:
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'Trigger Source'
        required: false
        default: 'supabase'

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'requirements_forecast_evaluation.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_forecast_evaluation.txt

    - name: Run script
      run: |
        python forecast_evaluation.py
      env:
        SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
        SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
